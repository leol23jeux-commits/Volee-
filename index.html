<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volée — Progresse au badminton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --court:#0F3D3E;
    --court-2:#144C4C;
    --court-3:#1B5F5C;
    --cream:#F5EFDD;
    --cream-dim:#CFCBB6;
    --coral:#E8462F;
    --coral-dim:#c93a25;
    --line:rgba(245,239,221,0.14);
    --radius:14px;
    --c-muscu:#E8462F;
    --c-technique:#F4C430;
    --c-physique:#3ED6C4;
    --c-mental:#B48CFF;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(600px circle at 90% -10%, rgba(244,196,48,0.16), transparent 60%),
      radial-gradient(700px circle at -10% 20%, rgba(232,70,47,0.16), transparent 55%),
      radial-gradient(600px circle at 100% 60%, rgba(62,214,196,0.12), transparent 55%),
      radial-gradient(500px circle at 0% 90%, rgba(180,140,255,0.14), transparent 55%),
      var(--court);
    background-attachment:fixed;
    color:var(--cream);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Anton',sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    text-transform:uppercase;
    line-height:0.95;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;
    background:linear-gradient(180deg, var(--court) 60%, rgba(15,61,62,0));
    backdrop-filter:blur(6px);
  }
  .logo{display:flex;align-items:center;gap:8px;font-family:'Anton',sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:0.02em;
    background:linear-gradient(90deg, var(--c-muscu), var(--c-technique), var(--c-physique), var(--c-mental));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);display:inline-block;}
  nav.tabs{display:flex;gap:4px;background:rgba(0,0,0,0.18);padding:4px;border-radius:100px;}
  nav.tabs button{
    background:transparent;border:none;color:var(--cream-dim);
    padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;
    cursor:pointer;transition:all .2s;
  }
  nav.tabs button.active{background:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(232,70,47,0.4);}
  .icon-btn{
    background:rgba(245,239,221,0.08);border:1px solid var(--line);
    color:var(--cream);width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;
  }

  main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- signature: shuttlecock arc ---------- */
  .arc-wrap{position:relative;width:100%;overflow:hidden;}
  svg.arc{width:100%;display:block;}
  .arc-path{fill:none;stroke:var(--coral);stroke-width:2;stroke-dasharray:6 6;opacity:0.55;}
  .arc-dot{fill:var(--cream);}

  /* ---------- hero ---------- */
  .hero{padding:64px 0 40px;position:relative;overflow:hidden;}
  .hero::before{
    content:"";position:absolute;top:-120px;right:-100px;width:340px;height:340px;
    background:conic-gradient(from 180deg, var(--c-muscu), var(--c-technique), var(--c-physique), var(--c-mental), var(--c-muscu));
    filter:blur(90px);opacity:0.35;border-radius:50%;pointer-events:none;
  }
  .hero > *{position:relative;z-index:1;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;
    color:var(--c-technique);text-transform:uppercase;margin-bottom:18px;
  }
  .hero h1{font-size:clamp(40px,10vw,72px);margin-bottom:20px;}
  .hero h1 .accent{
    background:linear-gradient(90deg, var(--coral), var(--c-technique));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p.lede{font-size:17px;color:var(--cream-dim);max-width:480px;line-height:1.5;margin-bottom:32px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(90deg, var(--coral), #ff7a5c);
    color:#fff;border:none;
    padding:14px 26px;border-radius:100px;font-weight:700;font-size:14px;
    text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;
    transition:transform .15s, box-shadow .15s;
    box-shadow:0 6px 20px rgba(232,70,47,0.35);
  }
  .btn:active{transform:scale(0.97);}
  .btn:hover{box-shadow:0 8px 26px rgba(232,70,47,0.5);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--cream);}
  .btn.block{width:100%;justify-content:center;}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;}

  .stat-row{display:flex;gap:28px;margin-top:44px;flex-wrap:wrap;}
  .stat{border-left:3px solid var(--coral);padding-left:12px;}
  .stat .num{font-family:'Anton',sans-serif;font-size:28px;display:block;color:var(--cream);}
  .stat .label{font-size:11px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:0.06em;}

  /* ---------- cards / sections ---------- */
  .section{padding:36px 0;border-top:1px solid var(--line);}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
  .section-head h2{font-size:26px;}
  .section-head .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cream-dim);}

  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;-ms-overflow-style:none;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;background:rgba(245,239,221,0.06);border:1px solid var(--line);
    color:var(--cream-dim);padding:8px 16px;border-radius:100px;font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:all .15s;
  }
  .chip.active{background:var(--cream);color:var(--court);border-color:var(--cream);}
  .chip.active[data-cat="muscu"]{background:var(--c-muscu);border-color:var(--c-muscu);color:#fff;}
  .chip.active[data-cat="technique"]{background:var(--c-technique);border-color:var(--c-technique);color:#1a1400;}
  .chip.active[data-cat="physique"]{background:var(--c-physique);border-color:var(--c-physique);color:#00302b;}
  .chip.active[data-cat="mental"]{background:var(--c-mental);border-color:var(--c-mental);color:#1f0f4d;}

  .filter-group{margin-bottom:10px;}
  .filter-group .fg-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;display:block;}

  .card{
    background:rgba(245,239,221,0.05);
    border:1px solid var(--line);
    border-left:3px solid var(--cat-color, var(--coral));
    border-radius:var(--radius);
    padding:20px;margin-bottom:14px;
    transition:transform .15s, background .15s;
  }
  .card:hover{background:rgba(245,239,221,0.08);transform:translateX(2px);}
  .card .tag-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;padding:3px 9px;border-radius:100px;}
  .tag.cat{background:color-mix(in srgb, var(--cat-color, var(--coral)) 22%, transparent);color:var(--cat-color, #ff8a76);}
  .tag.obj{background:rgba(245,239,221,0.1);color:var(--cream-dim);}
  .card h3{font-size:19px;text-transform:none;font-family:'Work Sans',sans-serif;font-weight:700;margin-bottom:8px;line-height:1.25;}
  .card p{font-size:14.5px;color:var(--cream-dim);line-height:1.55;margin:0;white-space:pre-line;}
  .empty{color:var(--cream-dim);font-size:14px;padding:30px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);}

  /* ---------- forms ---------- */
  .auth-card{max-width:400px;margin:60px auto 0;background:rgba(245,239,221,0.05);border:1px solid var(--line);border-radius:var(--radius);padding:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--cream-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
  .field input,.field select,.field textarea{
    width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--line);
    color:var(--cream);padding:12px 14px;border-radius:10px;font-size:15px;font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--coral);outline-offset:1px;}
  .switch-line{text-align:center;font-size:13px;color:var(--cream-dim);margin-top:16px;}
  .switch-line button{background:none;border:none;color:var(--coral);font-weight:700;cursor:pointer;text-decoration:underline;padding:0;}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .msg.err{background:rgba(232,70,47,0.16);color:#ff8a76;}
  .msg.ok{background:rgba(120,200,150,0.16);color:#8fe0ab;}

  footer{padding:30px 20px;text-align:center;font-size:12px;color:var(--cream-dim);border-top:1px solid var(--line);}

  .hidden{display:none !important;}
  @media(max-width:520px){
    nav.tabs{display:none;}
    header.topbar{padding:14px 16px;}
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="logo"><span class="dot"></span>Volée</div>
    <nav class="tabs" id="mainTabs">
      <button data-view="home">Accueil</button>
      <button data-view="conseils">Conseils</button>
      <button data-view="profil" id="tabProfil">Profil</button>
    </nav>
    <div id="authBtnWrap"><button class="icon-btn" id="authIconBtn" title="Compte">＋</button></div>
  </header>

  <main id="main"></main>

  <footer>Volée — construit par un badiste, pour les badistes.</footer>
</div>

<script>
/* ====================== CONFIG ====================== */
const SUPABASE_URL = "https://ocdvgaswrtgantjvtoqc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_s154Mt91L3wyCQstvIngsQ_tY4SNn6Z";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ====================== STATE ====================== */
let state = {
  session: null,
  profile: null,
  tips: [],
  activeCat: 'toutes',
  activeObj: 'tous',
};

const CATEGORIES = [
  {id:'toutes', label:'Toutes'},
  {id:'muscu', label:'Musculation'},
  {id:'technique', label:'Technique'},
  {id:'physique', label:'Physique'},
  {id:'mental', label:'Mental'},
];
const OBJECTIVES = [
  {id:'tous', label:'Tous objectifs'},
  {id:'smash', label:'Progresser au smash'},
  {id:'endurance', label:'Endurance'},
  {id:'blessures', label:'Éviter les blessures'},
  {id:'vitesse', label:'Vitesse / déplacements'},
  {id:'service', label:'Service'},
];

/* ====================== ROUTER ====================== */
function currentRoute(){
  return (location.hash || '#/').replace('#/','') || 'home';
}
window.addEventListener('hashchange', render);

/* ====================== AUTH ====================== */
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(session) await loadProfile();
  sb.auth.onAuthStateChange(async (_event, session)=>{
    state.session = session;
    if(session){ await loadProfile(); } else { state.profile = null; }
    render();
  });
}

async function loadProfile(){
  if(!state.session) return;
  const { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  state.profile = data;
}

async function signUp(email, password){
  return await sb.auth.signUp({ email, password });
}
async function signIn(email, password){
  return await sb.auth.signInWithPassword({ email, password });
}
async function signOut(){
  await sb.auth.signOut();
  location.hash = '#/home';
}

/* ====================== DATA ====================== */
async function loadTips(){
  const { data, error } = await sb.from('tips').select('*').order('created_at', {ascending:false});
  if(!error) state.tips = data || [];
}

function filteredTips(){
  return state.tips.filter(t=>{
    const catOk = state.activeCat==='toutes' || t.category===state.activeCat;
    const objOk = state.activeObj==='tous' || t.objective===state.activeObj;
    return catOk && objOk;
  });
}

/* ====================== RENDER ====================== */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

function catLabel(id){ return (CATEGORIES.find(c=>c.id===id)||{}).label || id; }
function objLabel(id){ return (OBJECTIVES.find(o=>o.id===id)||{}).label || id; }
function catColor(id){
  return {muscu:'var(--c-muscu)', technique:'var(--c-technique)', physique:'var(--c-physique)', mental:'var(--c-mental)'}[id] || 'var(--coral)';
}

function arcSVG(){
  return `<div class="arc-wrap"><svg class="arc" viewBox="0 0 400 60" preserveAspectRatio="none">
    <path class="arc-path" d="M0,50 Q200,-10 400,50"></path>
    <circle class="arc-dot" cx="0" cy="50" r="3"></circle>
    <circle class="arc-dot" cx="400" cy="50" r="3"></circle>
  </svg></div>`;
}

function renderHome(){
  const box = el(`<div></div>`);
  box.appendChild(el(`
    <section class="hero">
      <div class="eyebrow">● En jeu — plateforme badminton</div>
      <h1>Progresse<br>à chaque <span class="accent">volée</span>.</h1>
      <p class="lede">Des conseils d'entraînement — musculation, technique, physique, mental — classés par catégorie et par objectif, pour transformer chaque séance en progrès concret.</p>
      <div class="btn-row">
        <button class="btn" id="ctaConseils">Voir les conseils →</button>
        ${state.session ? '' : '<button class="btn ghost" id="ctaAuth">Créer un compte</button>'}
      </div>
      <div class="stat-row">
        <div class="stat" style="border-color:var(--coral);"><span class="num mono">${state.tips.length || '—'}</span><span class="label">Conseils</span></div>
        <div class="stat" style="border-color:var(--c-technique);"><span class="num mono">${CATEGORIES.length-1}</span><span class="label">Catégories</span></div>
        <div class="stat" style="border-color:var(--c-physique);"><span class="num mono">${OBJECTIVES.length-1}</span><span class="label">Objectifs</span></div>
      </div>
    </section>
  `));
  box.appendChild(el(arcSVG()));
  box.appendChild(el(`
    <section class="section">
      <div class="section-head"><h2>Derniers conseils</h2><span class="count mono">aperçu</span></div>
      <div id="homePreview"></div>
    </section>
  `));
  return box;
}

function tipCard(t){
  return `<div class="card" style="--cat-color:${catColor(t.category)};">
    <div class="tag-row">
      <span class="tag cat">${catLabel(t.category)}</span>
      <span class="tag obj">${objLabel(t.objective)}</span>
    </div>
    <h3>${t.title}</h3>
    <p>${t.content}</p>
  </div>`;
}

function renderConseils(){
  const box = el(`
    <section class="section" style="border-top:none;padding-top:32px;">
      <div class="section-head">
        <h2>Conseils d'entraînement</h2>
        <span class="count mono">${filteredTips().length} résultat(s)</span>
      </div>
      <div class="filter-group">
        <span class="fg-label">Catégorie</span>
        <div class="filters" id="catFilters"></div>
      </div>
      <div class="filter-group">
        <span class="fg-label">Objectif</span>
        <div class="filters" id="objFilters"></div>
      </div>
      <div id="tipsList"></div>
    </section>
  `);
  const catWrap = box.querySelector('#catFilters');
  CATEGORIES.forEach(c=>{
    const chip = el(`<button class="chip ${state.activeCat===c.id?'active':''}" data-cat="${c.id}">${c.label}</button>`);
    chip.onclick = ()=>{ state.activeCat=c.id; render(); };
    catWrap.appendChild(chip);
  });
  const objWrap = box.querySelector('#objFilters');
  OBJECTIVES.forEach(o=>{
    const chip = el(`<button class="chip ${state.activeObj===o.id?'active':''}">${o.label}</button>`);
    chip.onclick = ()=>{ state.activeObj=o.id; render(); };
    objWrap.appendChild(chip);
  });
  const list = box.querySelector('#tipsList');
  const tips = filteredTips();
  if(tips.length===0){
    list.appendChild(el(`<div class="empty">Aucun conseil pour ce filtre. Change de catégorie ou d'objectif.</div>`));
  } else {
    tips.forEach(t=> list.appendChild(el(tipCard(t))));
  }
  return box;
}

function renderProfil(){
  if(!state.session){
    return renderAuth();
  }
  const p = state.profile || {};
  const box = el(`
    <section class="section" style="border-top:none;padding-top:32px;">
      <div class="section-head"><h2>Mon profil</h2></div>
      <div class="auth-card" style="margin:0;">
        <div id="profileMsg"></div>
        <div class="field"><label>Pseudo</label><input id="pPseudo" type="text" value="${p.pseudo||''}" placeholder="Ton pseudo sur les terrains"></div>
        <div class="field"><label>Ville</label><input id="pVille" type="text" value="${p.ville||''}" placeholder="Ta ville"></div>
        <div class="field"><label>Disponibilités</label><input id="pDispo" type="text" value="${p.dispo||''}" placeholder="Ex: mardi soir, week-end"></div>
        <button class="btn block" id="saveProfil">Enregistrer</button>
      </div>
      <div style="margin-top:20px;text-align:center;">
        <button class="btn ghost" id="logoutBtn">Se déconnecter</button>
      </div>
    </section>
  `);
  box.querySelector('#saveProfil').onclick = async ()=>{
    const pseudo = box.querySelector('#pPseudo').value.trim();
    const ville = box.querySelector('#pVille').value.trim();
    const dispo = box.querySelector('#pDispo').value.trim();
    const { error } = await sb.from('profiles').upsert({
      id: state.session.user.id, pseudo, ville, dispo, updated_at: new Date().toISOString()
    });
    const msgBox = box.querySelector('#profileMsg');
    if(error){
      msgBox.innerHTML = `<div class="msg err">Erreur : ${error.message}</div>`;
    } else {
      await loadProfile();
      msgBox.innerHTML = `<div class="msg ok">Profil enregistré ✓</div>`;
    }
  };
  box.querySelector('#logoutBtn').onclick = signOut;
  return box;
}

function renderAuth(){
  let mode = 'login';
  const box = el(`
    <section class="section" style="border-top:none;">
      <div class="auth-card">
        <h2 style="font-size:22px;margin-bottom:18px;" id="authTitle">Connexion</h2>
        <div id="authMsg"></div>
        <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="toi@exemple.com"></div>
        <div class="field"><label>Mot de passe</label><input id="authPass" type="password" placeholder="••••••••"></div>
        <button class="btn block" id="authSubmit">Se connecter</button>
        <div class="switch-line">Pas encore de compte ? <button id="authSwitch">Créer un compte</button></div>
      </div>
    </section>
  `);
  function refreshMode(){
    box.querySelector('#authTitle').textContent = mode==='login' ? 'Connexion' : 'Créer un compte';
    box.querySelector('#authSubmit').textContent = mode==='login' ? 'Se connecter' : "S'inscrire";
    box.querySelector('#authSwitch').textContent = mode==='login' ? 'Créer un compte' : 'Se connecter';
    box.querySelector('.switch-line').firstChild.textContent = mode==='login' ? 'Pas encore de compte ? ' : 'Déjà un compte ? ';
  }
  box.querySelector('#authSwitch').onclick = ()=>{ mode = mode==='login'?'signup':'login'; refreshMode(); };
  box.querySelector('#authSubmit').onclick = async ()=>{
    const email = box.querySelector('#authEmail').value.trim();
    const pass = box.querySelector('#authPass').value;
    const msgBox = box.querySelector('#authMsg');
    msgBox.innerHTML = '';
    if(!email || !pass){ msgBox.innerHTML = `<div class="msg err">Renseigne email et mot de passe.</div>`; return; }
    const { error } = mode==='login' ? await signIn(email, pass) : await signUp(email, pass);
    if(error){
      msgBox.innerHTML = `<div class="msg err">${error.message}</div>`;
    } else if(mode==='signup'){
      msgBox.innerHTML = `<div class="msg ok">Compte créé — vérifie tes emails si une confirmation est demandée.</div>`;
    } else {
      location.hash = '#/profil';
      render();
    }
  };
  return box;
}

function updateTabs(){
  document.querySelectorAll('#mainTabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===currentRoute());
  });
  document.getElementById('tabProfil').textContent = state.session ? 'Profil' : 'Connexion';
  document.getElementById('authIconBtn').style.display = state.session ? 'none' : 'flex';
}

async function render(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const route = currentRoute();
  updateTabs();
  let view;
  if(route==='conseils') view = renderConseils();
  else if(route==='profil') view = renderProfil();
  else if(route==='auth') view = renderAuth();
  else view = renderHome();
  main.appendChild(view);

  if(route==='home'){
    const preview = document.getElementById('homePreview');
    if(preview){
      const recent = state.tips.slice(0,3);
      if(recent.length===0){
        preview.appendChild(el(`<div class="empty">Les premiers conseils arrivent bientôt.</div>`));
      } else {
        recent.forEach(t=> preview.appendChild(el(tipCard(t))));
      }
    }
    const ctaConseils = document.getElementById('ctaConseils');
    if(ctaConseils) ctaConseils.onclick = ()=>{ location.hash='#/conseils'; };
    const ctaAuth = document.getElementById('ctaAuth');
    if(ctaAuth) ctaAuth.onclick = ()=>{ location.hash='#/auth'; };
  }
}

/* ====================== NAV WIRING ====================== */
document.querySelectorAll('#mainTabs button').forEach(b=>{
  b.onclick = ()=>{ location.hash = '#/' + b.dataset.view; };
});
document.getElementById('authIconBtn').onclick = ()=>{ location.hash = '#/auth'; };

/* ====================== BOOT ====================== */
(async function boot(){
  await initAuth();
  await loadTips();
  render();
})();
</script>
</body>
</html>
